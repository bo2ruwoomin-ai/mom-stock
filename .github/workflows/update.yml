name: 시세 갱신 및 사이트 배포

on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'     # 국내장 09:00~15:59 KST, 10분마다
    - cron: '20 7,10,13 * * 1-5'    # 국내 마감 확정·저녁 데이터셋 갱신 반영
    - cron: '*/20 14-21 * * 1-5'    # 미국장 23:00~06:59 KST, 20분마다
    - cron: '30 17 * * 0,6'         # 주말 하루 한 번
  push:
    branches: [main]
    paths: ['index.html', 'pipeline/**', 'state/editorial.json', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow
      - name: 시세 모으기·빌드
        run: python pipeline/run.py
      - name: 상태 저장(장중 기록·미국 일봉)
        run: |
          git config user.name "jangse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/auto.json state/curated.json
          git diff --cached --quiet || git commit -m "시세 자동 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
